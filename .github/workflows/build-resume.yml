name: Build Resume

on:
  push:
    paths:
      - resume.yaml
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-latex-recommended

      - name: Build resume.tex and resume.pdf
        run: python build_resume.py --pdf

      - name: Commit and push updated resume
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume.tex resume.pdf
          git diff --cached --quiet || git commit -m "Auto-build resume from resume.yaml"
          git push
